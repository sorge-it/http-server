name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Dependabot updates the actions and the images of `.github/docker`. Composer, pinned by digest in
# `tools`, is updated by hand, to the version of the Composer image in `.github/docker`.

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.stack }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest versions: without the platform of composer.json, which is PHP 8.4.1 for the lock.
          - php: '8.5'
            os: ubuntu-24.04
            chrome: /usr/bin/google-chrome
            stack: newest
            install: composer config --unset platform.php && composer update --no-interaction --prefer-dist
          # The versions of composer.lock, on Linux and on macOS.
          - php: '8.4'
            os: ubuntu-24.04
            chrome: /usr/bin/google-chrome
            stack: locked
            install: composer install --no-interaction --prefer-dist
          - php: '8.5'
            os: ubuntu-24.04
            chrome: /usr/bin/google-chrome
            stack: locked
            install: composer install --no-interaction --prefer-dist
          - php: '8.5'
            os: macos-15
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
            stack: locked
            install: composer install --no-interaction --prefer-dist

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
          coverage: none
          tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6

      # The Go of the reference of GoNetHttpTest.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/GoNetHttp/go.mod
          cache: false

      # The build of the reference, where GoReference.php keeps it. A tag builds without the cache;
      # the job publishes nothing, so zizmor's finding does not apply.
      - name: Cache Go
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .go/cache
          key: go-${{ runner.os }}-${{ hashFiles('tests/GoNetHttp/reference/*.go') }}
          restore-keys: go-${{ runner.os }}-

      - name: Install dependencies
        run: ${{ matrix.install }}

      # The binary is about 200 MB; without the cache each job loads it again.
      - name: Cache FrankenPHP
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .frankenphp
          key: frankenphp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Fixtures/frankenphp/release.lock') }}

      - name: Install FrankenPHP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: composer frankenphp:install

      # The example of the README runs with the Chrome of the runner image. The steps of `composer
      # test`, with an event log: the macOS job hung twice, and its output names no test.
      - name: Test
        timeout-minutes: 10
        env:
          CHROME: ${{ matrix.chrome }}
        run: |
          composer test:lint
          composer test:types
          composer test:type-coverage
          vendor/bin/pest --log-events-text "$RUNNER_TEMP/events.txt"

      # The step limit leaves time for this: the last test that started, and what still runs.
      - name: Show where the tests stopped
        if: failure()
        run: |
          grep -E 'Test (Prepared|Finished)' "$RUNNER_TEMP/events.txt" | tail -n 6 || true
          ps -A -o pid,ppid,etime,command | awk '/frankenphp|http-server-go|pest|Chrome/ && !/awk/'

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6

      - name: Validate
        run: composer validate --strict

      - name: Audit
        run: composer audit --locked

  # The Go of the tests: the reference and the program that takes the cases from Go.
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/GoNetHttp/go.mod
          cache: false

      - name: Format
        working-directory: tests/GoNetHttp
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: Vet
        working-directory: tests/GoNetHttp
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

  coverage:
    name: Coverage · PHP 8.5
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: sockets
          coverage: pcov
          # The php.ini of setup-php compiles assert() out, so a line of an assert would count as
          # not run.
          ini-values: zend.assertions=1
          tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/GoNetHttp/go.mod
          cache: false

      - name: Cache Go
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .go/cache
          key: go-coverage-${{ hashFiles('tests/GoNetHttp/reference/*.go') }}
          restore-keys: go-coverage-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache FrankenPHP
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .frankenphp
          key: frankenphp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Fixtures/frankenphp/release.lock') }}

      - name: Install FrankenPHP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: composer frankenphp:install

      - name: Coverage
        run: composer test:coverage

  # Alpine, on musl, on x64 and arm64. Not as root, so the tests of modes run.
  alpine:
    name: Alpine · ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache FrankenPHP
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .frankenphp
          key: frankenphp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Fixtures/frankenphp/release.lock') }}

      - name: Build
        run: docker build --quiet --tag tests .github/docker/alpine

      # Into the tree, so the cache keeps it and the container of the test copies it.
      - name: Install FrankenPHP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm --env GITHUB_TOKEN --volume "$PWD:/src" --workdir /src --entrypoint php tests tests/FrankenPhp/install-frankenphp.php

      - name: Test
        run: |
          docker run --rm --volume "$PWD:/src:ro" --entrypoint sh tests -euc '
            cp -a /src /work
            chown -R www-data /work
            su www-data -s /bin/sh -c "cd /work && export COMPOSER_HOME=/tmp/composer && composer install --no-interaction --no-progress && composer test"
          '

  # Debian, with PHP 8.4. Not as root, so the tests of modes run.
  debian:
    name: Debian · PHP 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache FrankenPHP
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .frankenphp
          key: frankenphp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Fixtures/frankenphp/release.lock') }}

      - name: Build
        run: docker build --quiet --tag tests .github/docker/debian

      # Into the tree, so the cache keeps it and the container of the test copies it.
      - name: Install FrankenPHP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm --env GITHUB_TOKEN --volume "$PWD:/src" --workdir /src --entrypoint php tests tests/FrankenPhp/install-frankenphp.php

      - name: Test
        run: |
          docker run --rm --volume "$PWD:/src:ro" --entrypoint sh tests -euc '
            cp -a /src /work
            chown -R www-data /work
            su www-data -s /bin/sh -c "cd /work && export COMPOSER_HOME=/tmp/composer && composer install --no-interaction --no-progress && composer test"
          '

  # The workflows, by the checks that need no GitHub token.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit
        run: |
          docker build --quiet --tag zizmor .github/docker/zizmor
          docker run --rm --volume "$PWD:/src:ro" --workdir /src zizmor --offline .github

      - name: Lint
        run: |
          docker build --quiet --tag actionlint .github/docker/actionlint
          docker run --rm --volume "$PWD:/src:ro" --workdir /src actionlint -no-color
