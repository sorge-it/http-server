name: caddy

# Against the newest releases of Caddy and FrankenPHP: composer check:caddy. A difference fails the
# job. The weekly job of frankenphp.yml tests the newest FrankenPHP, with its Caddy.

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/Fixtures/caddy/**
      - tests/Caddy/**
      - tests/Upstream.php
      - composer.json
      - .github/workflows/caddy.yml
  pull_request:
    paths:
      - tests/Fixtures/caddy/**
      - tests/Caddy/**
      - tests/Upstream.php
      - composer.json
      - .github/workflows/caddy.yml

permissions:
  contents: read

jobs:
  caddy:
    name: Newest Caddy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: sockets
          coverage: none
          tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Compare with caddy.lock and frankenphp.lock
        run: composer check:caddy
