version: 2

# Each update waits 14 days after its release, so a broken or taken-over release is found by others
# first. No Composer: the lock serves only the test tools, and the newest job takes their updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  # The images the jobs of Alpine, Debian and the workflows run in, and the image of the demo. None
  # is under .github: GitHub refuses a pull request of this ecosystem that changes a file there.
  - package-ecosystem: docker
    directories:
      - /demo
      - /docker/actionlint
      - /docker/alpine
      - /docker/debian
      - /docker/zizmor
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ['*']
    # Debian runs the lowest PHP the package requires; only its patches are updates.
    ignore:
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Go is the version of tests/Fixtures/go-net-http/go/VERSION; only its digest is an update.
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
